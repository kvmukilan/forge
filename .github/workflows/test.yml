name: Production readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-only-secret-never-use-in-production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build and smoke-test the production container
        run: |
          set -euo pipefail
          docker build -t forge:ci .
          docker run -d --name forge-ci -p 127.0.0.1:3000:3000 -e AUTH_SECRET forge:ci
          trap 'docker logs forge-ci; docker rm -f forge-ci' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 --retry-max-time 60 --max-time 5 http://127.0.0.1:3000/api/health
          curl --fail http://127.0.0.1:3000/login > /dev/null
